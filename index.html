<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MapLibre testi</title>

  <!-- MapLibre GL JS CSS -->
  <link
    href="https://unpkg.com/maplibre-gl@3.5.2/dist/maplibre-gl.css"
    rel="stylesheet"
  />
</head>

<body>
  <div id="map"></div>
  
    <!-- Material selection: top left -->
    <div id="map-controls">
      <label for="material-filter">Material</label>

      <select id="material-filter">
        <option value="Betoni">Concrete</option>
        <option value="Puu">Wood</option>
      </select>
    </div>

    <!-- Legend: bottom left -->
    <div id="material-legend">
      <strong id="legend-title"></strong>
      <div id="legend-reference">Circle size – reference quantities</div>
      <div id="legend-values"></div>
      <div id="legend-limit"></div>

    </div>

  <!-- MapLibre JS (kirjasto) -->
  <script src="https://unpkg.com/maplibre-gl@3.5.2/dist/maplibre-gl.js"></script>

  <!-- Paikallinen API-avain -->
  <script src="./config.js"></script>

  <!-- Oma karttakoodi -->
  <script src="./script.js"></script>
</body>
</html>
